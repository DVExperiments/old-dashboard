name: Refresh project catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_catalogue.py'
      - '.github/workflows/refresh-catalogue.yml'
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static catalogue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalogue.py
      - name: Commit refreshed catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects-catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public project catalogue'
            git push
          fi
